<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGV Development — девелопмент повного циклу</title>
<meta name="description" content="BGV Development реалізує житлові, комерційні та соціальні проєкти в Україні: від преміальних вілл і житлових комплексів до торгово-розважальних центрів. Девелопмент повного циклу з інвестиційною міцністю групи BGV.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BGV Development">
<meta property="og:title" content="BGV Development — створюємо простір для життя, бізнесу та майбутнього">
<meta property="og:description" content="Девелопмент повного циклу з інвестиційною міцністю групи BGV.">
<meta property="og:url" content="https://bgv-development.com.ua/">
<meta property="og:locale" content="uk_UA">
<meta property="og:image" content="https://bgv-development.com.ua/wp-content/uploads/2025/06/bgv-development_1200.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНИ: кольори, шрифти, радіуси (редагуйте тут) ============ */
:root{
  --bg:#ECEEE9;        /* вапняк */
  --surface:#F7F8F4;
  --ink:#16332D;       /* хвоя */
  --muted:#56675F;
  --line:#D2D8CF;
  --accent:#B8872C;    /* стигле жито */
  --accent-soft:#EAD9B4;
  --on-accent:#16332D;
  --deep:#16332D;
  --on-deep:#EEF0EA;
  --on-deep-muted:#A9BBB2;
  --river:#9EC0C0;
  --f-display:'Unbounded', 'Arial Black', Arial, sans-serif;
  --f-body:'Onest', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r-xl:32px; --r-lg:22px; --r-md:14px;
  --wrap:1320px;
  --pad:clamp(18px,4.6vw,56px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B18; --surface:#15261F; --ink:#E5EBE4; --muted:#9FB1A7; --line:#27403A;
    --accent:#D6A84A; --accent-soft:#3A3322; --on-accent:#10201C;
    --deep:#1A332C; --on-deep:#E9EEE7; --on-deep-muted:#A6B8AE; --river:#3F6668;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B18; --surface:#15261F; --ink:#E5EBE4; --muted:#9FB1A7; --line:#27403A;
  --accent:#D6A84A; --accent-soft:#3A3322; --on-accent:#10201C;
  --deep:#1A332C; --on-deep:#E9EEE7; --on-deep-muted:#A6B8AE; --river:#3F6668;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);overflow-x:hidden}
img,svg{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:300;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2.1rem,5.4vw,4.7rem);line-height:1.04}
h2{font-size:clamp(1.65rem,3.4vw,2.85rem);line-height:1.1}
h3{font-size:clamp(1.05rem,1.5vw,1.25rem);line-height:1.3;font-weight:400}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}
.muted{color:var(--muted)}
.lead{font-size:clamp(1.02rem,1.3vw,1.15rem);color:var(--muted);max-width:60ch}
.sec{padding-block:clamp(56px,7vw,104px)}
.sec--tight{padding-block:clamp(40px,6vw,80px)}
.sec__head{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:end;justify-content:space-between;margin-bottom:clamp(28px,4vw,52px)}
.sec__head h2{max-width:20ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:var(--bg);font-weight:500;font-size:.95rem;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:color-mix(in srgb,var(--ink) 86%,var(--accent))}
.btn--accent{background:var(--accent);color:var(--on-accent)}
.btn--accent:hover{background:color-mix(in srgb,var(--accent) 85%,#fff)}
.btn--line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn--line:hover{background:var(--surface);border-color:var(--ink)}
.btn--on-deep{background:var(--on-deep);color:var(--deep)}
.btn--sm{min-height:40px;padding:0 18px;font-size:.9rem}
.btn svg{width:18px;height:18px}
.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px;background:none;border:0;padding:0;cursor:pointer;font-weight:500}

/* шапка */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.is-scrolled{border-bottom-color:var(--line)}
.hdr__in{display:flex;align-items:center;gap:24px;height:76px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex:none}
.logo__mark{font-family:var(--f-display);font-weight:500;font-size:1.55rem;letter-spacing:-.04em}
.logo__word{font-family:var(--f-display);font-weight:300;font-size:.8rem;letter-spacing:.02em;color:var(--muted)}
.nav{display:none;margin-inline:auto}
.nav>ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.nav__item{position:relative}
.nav__item>a{display:flex;align-items:center;gap:4px;padding:10px 12px;border-radius:999px;text-decoration:none;font-size:.93rem;font-weight:500}
.nav__item>a:hover,.nav__item:focus-within>a{background:var(--surface)}
.nav__item>a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.nav__item svg{width:14px;height:14px;opacity:.6}
.sub{position:absolute;top:100%;left:0;padding-top:10px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:.18s}
.nav__item:hover .sub,.nav__item:focus-within .sub{opacity:1;visibility:visible;transform:none}
.sub ul{list-style:none;margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:280px;box-shadow:0 24px 48px -24px rgba(10,30,25,.35)}
.sub a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:.93rem}
.sub a:hover{background:var(--bg)}
.sub .sub__pdf{color:var(--muted);border-top:1px solid var(--line);margin-top:6px;padding-top:14px;border-radius:0}
.hdr__right{display:flex;align-items:center;gap:10px;margin-left:auto}
.hdr__phone{display:none;text-decoration:none;font-weight:500;font-size:.93rem;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hdr .btn--accent{display:none}
.hdr .btn--callback{display:none}
.burger{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}
.burger span{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
@media (min-width:640px){.hdr .btn--accent{display:inline-flex}}
@media (min-width:1220px){.nav{display:block}.burger{display:none}.hdr__right{margin-left:0}}
@media (min-width:1480px){.hdr__phone{display:block}}

/* мобільне меню */
.mnav{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:20px var(--pad) 40px;display:none}
.mnav.is-open{display:block}
.mnav__top{display:flex;justify-content:space-between;align-items:center;height:56px;margin-bottom:12px}
.mnav__close{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:none;font-size:1.4rem;cursor:pointer}
.mnav details{border-bottom:1px solid var(--line)}
.mnav summary,.mnav>.mnav__link{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-family:var(--f-display);font-weight:300;font-size:1.3rem;list-style:none;cursor:pointer;text-decoration:none;border-bottom:1px solid var(--line)}
.mnav details summary{border-bottom:0}
.mnav summary::-webkit-details-marker{display:none}
.mnav summary::after{content:"+";font-weight:200}
.mnav details[open] summary::after{content:"−"}
.mnav details a{display:block;padding:8px 0 8px 14px;text-decoration:none;color:var(--muted)}
.mnav details div{padding-bottom:14px}
.mnav__foot{display:grid;gap:12px;margin-top:28px}

/* медіа з ілюстрацією-заглушкою під фото */
.media{position:relative;overflow:hidden;background:var(--accent-soft);isolation:isolate}
.media>svg,.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media>img{z-index:1}

/* HERO */
.hero{padding-top:clamp(28px,5vw,64px)}
.hero__top{display:grid;gap:28px;align-items:end;margin-bottom:clamp(28px,4vw,48px)}
.hero__title{max-width:15ch}
.hero__title span{display:block}
.hero__side{display:grid;gap:22px;max-width:46ch}
.hero__sub{font-family:var(--f-display);font-weight:400;font-size:1.02rem;line-height:1.45}
.hero__btns{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:1000px){.hero__top{grid-template-columns:1.35fr 1fr}}
.slider{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:4/5;background:var(--deep)}
@media (min-width:640px){.slider{aspect-ratio:16/8}}
@media (min-width:1100px){.slider{aspect-ratio:16/6.6}}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.slide.is-active{opacity:1}
.slide .media{position:absolute;inset:0}
.slide .media>svg{transform:scale(1.06);transition:transform 7s ease-out}
.slide.is-active .media>svg{transform:scale(1)}
.slider__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,24,20,0) 25%,rgba(9,24,20,.35) 55%,rgba(9,24,20,.82));z-index:2;pointer-events:none}
.slider__cap{position:absolute;left:clamp(18px,3vw,36px);bottom:clamp(18px,3vw,32px);right:clamp(18px,3vw,36px);z-index:3;color:#F2F3EE;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.slider__cap>div{min-width:0;max-width:100%}
.slider__name{font-family:var(--f-display);font-weight:300;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.15}
.slider__meta{color:#D7DDD6;font-size:.92rem;margin-top:6px}
.slider__tabs{display:flex;gap:6px;flex-wrap:wrap}
.slider__tabs button{border:1px solid rgba(255,255,255,.35);background:rgba(10,25,21,.3);color:#F2F3EE;border-radius:999px;padding:8px 14px;font-size:.84rem;cursor:pointer;backdrop-filter:blur(6px)}
.slider__tabs button[aria-selected="true"]{background:#F2F3EE;color:#16332D;border-color:#F2F3EE}

/* мапа */
.mapsec__grid{display:grid;gap:clamp(24px,4vw,56px);align-items:start}
@media (min-width:1000px){.mapsec__grid{grid-template-columns:1.25fr 1fr}}
.map{position:relative;background:var(--surface);border-radius:var(--r-xl);padding:clamp(10px,2vw,24px);border:1px solid var(--line)}
.map__svg{width:100%;height:auto}
.map__region{fill:var(--bg);stroke:var(--line);stroke-width:2}
.map__dots{fill:url(#mapdots)}
.map__city{fill:color-mix(in srgb,var(--accent) 16%,var(--bg));stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:1.5}
.map__sea{fill:var(--river);opacity:.7}
.map__river{fill:none;stroke:var(--river);stroke-width:7;stroke-linecap:round}
.map__label{font:500 15px var(--f-body);fill:var(--muted)}
@media (max-width:640px){.map__label{font-size:20px}.map__label--city{font-size:26px!important}}
.map__label--city{font:400 20px var(--f-display);fill:var(--ink)}
.pin{cursor:pointer;outline:none}
.pin path{fill:var(--ink);transition:fill .2s}
.pin circle{fill:var(--bg)}
.pin .pin__ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.pin.is-active path,.pin:hover path,.pin:focus-visible path{fill:var(--accent)}
.pin.is-active .pin__ring{opacity:1}
.pin__g{transition:transform .25s;transform-box:fill-box;transform-origin:50% 100%}
.pin.is-active .pin__g{transform:scale(1.18)}
.maplist{display:grid;gap:8px;margin:24px 0}
.maplist button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:none;border-radius:var(--r-md);padding:14px 16px;cursor:pointer}
.maplist button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.maplist small{color:var(--muted);white-space:nowrap}
.mapcard{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:12px;border:1px solid var(--line)}
.mapcard .media{aspect-ratio:1;border-radius:var(--r-md)}
.mapcard h3{margin-bottom:6px}

/* статус */
.status{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.status--done::before{background:var(--ink)}

/* цифри */
.figures{display:grid;border-top:1px solid var(--line)}
.figure{padding:28px 0;border-bottom:1px solid var(--line)}
.figure__num{font-family:var(--f-display);font-weight:200;font-size:clamp(2.8rem,6.6vw,5.6rem);line-height:1;letter-spacing:-.04em;white-space:nowrap}
.figure__label{margin-top:12px;color:var(--muted)}
@media (min-width:760px){.figures{grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.figure{border-bottom:0;padding:36px 28px 36px 0}.figure+.figure{border-left:1px solid var(--line);padding-left:28px}}

/* переваги */
.adv{display:grid;gap:0;border-top:1px solid var(--line)}
.adv__item{display:grid;grid-template-columns:44px 1fr;gap:18px;align-content:start;padding:26px 0;border-bottom:1px solid var(--line)}
.adv__item svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:1.5}
.adv__item p{color:var(--muted);margin-top:6px}
@media (min-width:760px){.adv{grid-template-columns:1fr 1fr;column-gap:48px}}
@media (min-width:1100px){.adv{grid-template-columns:repeat(4,1fr);border-top:0}.adv__item{grid-template-columns:1fr;border-bottom:0;border-top:1px solid var(--ink);padding-top:22px}}

/* вкладки */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:10px 18px;font-size:.92rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a{border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:.92rem;white-space:nowrap}
.tabs a[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button span{opacity:.6;margin-left:4px}

/* проєкти */
.pgrid{display:grid;gap:clamp(28px,3vw,40px) clamp(20px,2.4vw,32px)}
@media (min-width:720px){.pgrid{grid-template-columns:1fr 1fr}}
.pcard{display:grid;gap:16px;align-content:start}
.pcard .media{aspect-ratio:4/3;border-radius:var(--r-xl)}
.pcard__badge{position:absolute;z-index:2;top:16px;left:16px;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500}
.pcard__title{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.pcard__title h3{font-size:clamp(1.15rem,1.8vw,1.5rem);font-weight:300}
.pcard__title a{text-decoration:none}
.pcard__facts{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:.93rem}
.pcard__actions{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.empty{padding:40px;border:1px dashed var(--line);border-radius:var(--r-lg);text-align:center;color:var(--muted)}

/* досягнення */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:36px 20px}
.ring{text-align:center}
.ring svg{width:min(170px,100%);margin:0 auto 14px;transform:rotate(-90deg)}
.ring__track{fill:none;stroke:var(--line);stroke-width:9}
.ring__bar{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)}
.ring__box{position:relative}
.ring__val{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--f-display);font-weight:300;font-size:1.9rem;line-height:1}
.ring__val small{display:block;font:500 .82rem var(--f-body);color:var(--muted);margin-top:6px;letter-spacing:0}

/* нагороди */
.awards__head{max-width:26ch}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:28px 20px;margin-top:clamp(28px,4vw,48px)}
.award{text-align:center;align-content:start}
.award__medal{position:relative;width:132px;height:132px;margin:0 auto 16px}
.award__medal svg{width:100%;height:100%}
.award__count{position:absolute;top:0;right:4px;background:var(--accent);color:var(--on-accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85rem}
.award h3{font-size:.98rem}
.award p{color:var(--muted);font-size:.88rem;margin-top:4px}
.award--empty .award__medal{border:1.5px dashed var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:1.8rem;font-weight:200}

/* інвесторам */
.deep{background:var(--deep);color:var(--on-deep);border-radius:var(--r-xl);padding:clamp(28px,6vw,80px);position:relative;overflow:hidden}
.deep .lead,.deep .muted{color:var(--on-deep-muted)}
.deep__grid{display:grid;gap:36px}
@media (min-width:1000px){.deep__grid{grid-template-columns:1fr 1fr;gap:64px}}
.deep__contour{position:absolute;right:-80px;top:-60px;width:520px;opacity:.12;pointer-events:none}
.deep__contour ellipse{fill:none;stroke:var(--on-deep);stroke-width:1.2}
.opps{display:grid;gap:0;border-top:1px solid rgba(255,255,255,.18)}
.opps div{padding:20px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.opps h3{margin-bottom:6px}
.opps p{color:var(--on-deep-muted)}
.deep__facts{display:grid;gap:18px;margin:32px 0}
.deep__facts b{display:block;font-family:var(--f-display);font-weight:200;font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.1;white-space:nowrap;margin-bottom:6px;color:var(--on-deep)}
.deep__facts span{color:var(--on-deep-muted);font-size:.93rem}
@media (min-width:640px){.deep__facts{grid-template-columns:1fr 1fr}}

/* новини */
.ngrid{display:grid;gap:32px 24px}
@media (min-width:640px){.ngrid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.ngrid{grid-template-columns:repeat(4,1fr)}}
.ncard{display:grid;gap:12px;align-content:start;text-decoration:none}
.ncard .media{aspect-ratio:16/11;border-radius:var(--r-lg)}
.ncard__cat{font-size:.84rem;font-weight:600;color:var(--accent)}
:root:not([data-theme="dark"]) .ncard__cat{color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.ncard h3{font-family:var(--f-body);font-weight:500;font-size:1.02rem;letter-spacing:0;line-height:1.4}
.ncard:hover h3{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.ncard time{color:var(--muted);font-size:.86rem}

/* про нас */
.split{display:grid;gap:clamp(28px,5vw,72px)}
@media (min-width:1000px){.split{grid-template-columns:1fr 1fr;align-items:start}}
.split .media{aspect-ratio:5/4;border-radius:var(--r-xl)}
.stack{display:grid;gap:18px;align-content:start}
.facts5{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);margin-top:12px}
.facts5 div{padding:20px 12px 20px 0;border-bottom:1px solid var(--line)}
.facts5 b{display:block;font-family:var(--f-display);font-weight:200;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.1;white-space:nowrap}
.facts5 span{color:var(--muted);font-size:.9rem}
.facts5 div:last-child{grid-column:1/-1}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.bullets li{padding:20px 0 20px 36px;border-bottom:1px solid var(--line);position:relative;color:var(--muted)}
.bullets li::before{content:"";position:absolute;left:4px;top:30px;width:16px;height:2px;background:var(--accent)}
.bullets b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}

/* сторінка */
.phead{padding-block:clamp(36px,6vw,80px) clamp(24px,4vw,48px)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.gallery{display:grid;gap:12px}
.gallery .media{border-radius:var(--r-lg);aspect-ratio:16/10}
.gallery .media:first-child{border-radius:var(--r-xl)}
@media (min-width:760px){.gallery{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.gallery .media:first-child{grid-row:1/3;aspect-ratio:auto;min-height:440px}.gallery .media{aspect-ratio:auto}}
.specs{display:grid;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:500;text-align:right}
.aside-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(22px,3vw,36px);display:grid;gap:18px}

/* форми */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.88rem;font-weight:500}
.field input,.field textarea,.field select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;min-height:50px}
.deep .field input,.deep .field textarea,.deep .field select{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:var(--on-deep)}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field.is-invalid input,.field.is-invalid textarea{border-color:#C0473A}
.field__err{font-size:.82rem;color:#C0473A;display:none}
.field.is-invalid .field__err{display:block}
.form__row{display:grid;gap:14px}
@media (min-width:640px){.form__row{grid-template-columns:1fr 1fr}}
.form__note{font-size:.8rem;color:var(--muted)}
.deep .form__note{color:var(--on-deep-muted)}
.thanks{display:grid;gap:12px;padding:12px 0}
.thanks__icon{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.thanks__icon svg{width:26px;height:26px}
.choice{display:grid;gap:10px}
.choice button,.choice label{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:16px 18px;cursor:pointer;font-weight:500}
.choice button:hover,.choice label:hover{border-color:var(--ink)}
.choice button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice small{display:block;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.92rem}
.chips input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

dialog.modal{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:var(--r-xl);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
dialog.modal::backdrop{background:rgba(8,22,18,.55);backdrop-filter:blur(3px)}

.modal__top{display:flex;justify-content:space-between;align-items:start;gap:16px}
.modal__top h2{font-size:clamp(1.35rem,2.6vw,1.8rem)}
.modal__close{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:1.3rem;line-height:1}
.quiz__bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.quiz__bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.quiz__step{font-size:.88rem;color:var(--muted)}
.quiz__nav{display:flex;justify-content:space-between;gap:10px;align-items:center}

.fab__btn{width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 30px -10px rgba(20,40,30,.55)}
.fab__btn svg{width:26px;height:26px;transition:transform .25s}
.fab.is-open .fab__btn svg{transform:rotate(135deg)}
.fab__menu{position:absolute;right:0;bottom:76px;display:grid;gap:8px;min-width:230px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s}
.fab.is-open .fab__menu{opacity:1;visibility:visible;transform:none}
.fab__menu a,.fab__menu button{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px;text-decoration:none;font-weight:500;cursor:pointer;text-align:left;box-shadow:0 10px 24px -14px rgba(0,0,0,.4)}
.fab__menu svg{width:18px;height:18px;flex:none}

/* контакт-смуга */

.clist{display:grid;gap:0;border-top:1px solid var(--line)}
.clist div{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.clist span{color:var(--muted);font-size:.88rem}
.clist a{text-decoration:none;font-weight:500}
.team{display:grid;gap:14px}
@media (min-width:640px){.team{grid-template-columns:1fr 1fr}}

.team b{display:block;font-weight:500}
.team span{color:var(--muted);font-size:.9rem;display:block;margin-bottom:8px}

/* футер */
.ftr{margin-top:clamp(40px,6vw,80px);background:var(--deep);color:var(--on-deep);padding-block:clamp(48px,6vw,80px) 28px}
.ftr a{text-decoration:none}
.ftr a:hover{text-decoration:underline;text-underline-offset:4px}
.ftr__grid{display:grid;gap:36px}
@media (min-width:760px){.ftr__grid{grid-template-columns:1.2fr 1fr 1fr 1.2fr}}
.ftr h4{font:600 .9rem var(--f-body);color:var(--on-deep-muted);margin-bottom:14px;letter-spacing:0}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ftr .logo__word{color:var(--on-deep-muted)}
.ftr__tag{margin-top:16px;color:var(--on-deep-muted);max-width:30ch}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.socials a{width:46px;height:46px;border-radius:50%;background:var(--on-deep);color:var(--deep);display:grid;place-items:center}
.socials a:hover{background:var(--accent);text-decoration:none}
.socials--light a{background:var(--ink);color:var(--bg)}
.socials svg{width:20px;height:20px}
.ftr__bottom{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);color:var(--on-deep-muted);font-size:.88rem}
.ftr__bottom nav{display:flex;gap:20px;flex-wrap:wrap}

/* одна орекстрована поява hero */
@media (prefers-reduced-motion:no-preference){
  .hero__title span{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .hero__title span:nth-child(2){animation-delay:.12s}
  .hero__side{animation:fade 1s .35s both}
  .slider{animation:fade 1.2s .2s both}
}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Ілюстрації-заглушки під рендери (показуються, поки фото не завантажене) ---------- */
let _sid = 0;
function scene(kind, v = 0) {
  const id = 's' + (++_sid);
  const skies = [['#D6E0DA', '#F2E5C6'], ['#CFDADF', '#EEE2CC'], ['#E0E1D3', '#F1D6A8']];
  const [s1, s2] = skies[v % 3];
  const sun = `<circle cx="${620 - (v % 3) * 170}" cy="${130 + (v % 2) * 30}" r="44" fill="#F7EDD5" opacity=".95"/>`;
  const head = `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient>`;
  let defs = '', body = '';
  if (kind === 'villas') {
    const villa = (x, y, w) => `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${w}" height="46" fill="#F5F3EC"/><rect x="-10" y="-7" width="${w + 20}" height="9" fill="#16332D"/><rect x="14" y="13" width="${w * .5}" height="24" fill="#2D4E46"/><rect x="${w * .5 + 24}" y="13" width="${w * .2}" height="33" fill="#C9973A" opacity=".8"/></g>`;
    let fence = ''; for (let x = 0; x <= 800; x += 38) fence += `<rect x="${x}" y="398" width="4" height="30" fill="#E9E4D6"/>`;
    const tree = (x, y, r) => `<rect x="${x - 2}" y="${y}" width="4" height="${r * 1.4}" fill="#1F3F37"/><circle cx="${x}" cy="${y}" r="${r}" fill="#3F6457"/>`;
    body = `<path d="M0 315 Q180 270 400 300 T800 285 V450 H0Z" fill="#A9B8A6"/>${villa(70, 296, 130)}${villa(300, 312, 150)}${villa(540, 300, 130)}${tree(250, 300, 22)}${tree(505, 300, 26)}${tree(730, 290, 20)}<path d="M0 360 Q260 335 520 360 T800 350 V450H0Z" fill="#5F7D6D"/><path d="M0 392 Q300 375 800 398 V450H0Z" fill="#16332D"/>${fence}<rect x="0" y="406" width="800" height="3" fill="#E9E4D6"/><rect x="0" y="418" width="800" height="3" fill="#E9E4D6"/>`;
  } else if (kind === 'towers') {
    defs = `<pattern id="${id}w" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#F3F1EA"/><rect x="3" y="4" width="12" height="9" fill="#9FB4B2"/></pattern>`;
    body = `<path d="M0 360 Q200 340 400 352 T800 345 V450H0Z" fill="#A9B8A6"/><rect x="250" y="80" width="126" height="300" fill="url(#${id}w)"/><rect x="244" y="72" width="138" height="10" fill="#16332D"/><rect x="410" y="150" width="112" height="230" fill="url(#${id}w)"/><rect x="410" y="150" width="112" height="70" fill="#E3DED0"/><g stroke="#16332D" stroke-width="3"><line x1="600" y1="40" x2="600" y2="380"/><line x1="380" y1="56" x2="660" y2="56"/><line x1="470" y1="56" x2="470" y2="130"/></g><rect x="462" y="130" width="16" height="10" fill="#C9973A"/><rect x="646" y="56" width="24" height="18" fill="#16332D"/><rect x="210" y="360" width="360" height="30" fill="#16332D"/><path d="M0 395 Q300 382 800 400 V450H0Z" fill="#1F3F37"/><circle cx="160" cy="370" r="24" fill="#3F6457"/><circle cx="680" cy="372" r="20" fill="#3F6457"/>`;
  } else if (kind === 'mall') {
    let stalks = ''; for (let x = 10; x < 800; x += 22) stalks += `<path d="M${x} 450 Q${x + 6} 420 ${x + 2} ${395 + (x % 5) * 3}" stroke="#8C6420" stroke-width="2" fill="none"/>`;
    body = `<path d="M0 320 Q220 300 420 318 T800 310 V450H0Z" fill="#B9C2AE"/><path d="M110 340 V282 Q180 246 250 282 T390 282 T530 282 T690 278 V340Z" fill="#F5F3EC"/><path d="M110 282 Q180 246 250 282 T390 282 T530 282 T690 278" fill="none" stroke="#C9973A" stroke-width="7"/><rect x="130" y="300" width="540" height="22" fill="#2D4E46"/><rect x="370" y="300" width="60" height="40" fill="#C9973A" opacity=".85"/><path d="M0 352 Q200 330 400 352 T800 346 V450H0Z" fill="#DDB866"/><path d="M0 385 Q220 362 430 386 T800 380 V450H0Z" fill="#C49437"/>${stalks}`;
  } else {
    let fins = ''; for (let i = 0; i < 24; i++) fins += `<rect x="${244 + i * 13.5}" y="${i % 3 === 0 ? 238 : 252}" width="6" height="${i % 3 === 0 ? 116 : 102}" fill="#16332D" opacity="${i % 2 ? .85 : .6}"/>`;
    body = `<path d="M0 335 Q220 310 420 330 T800 322 V450H0Z" fill="#A9B8A6"/><rect x="226" y="236" width="348" height="118" fill="#F5F3EC"/>${fins}<rect x="214" y="222" width="372" height="16" fill="#16332D"/><rect x="380" y="300" width="42" height="54" fill="#C9973A"/><rect x="628" y="250" width="6" height="110" fill="#1F3F37"/><circle cx="631" cy="245" r="52" fill="#3F6457"/><circle cx="120" cy="320" r="30" fill="#5F7D6D"/><path d="M0 370 Q300 350 800 372 V450H0Z" fill="#5F7D6D"/><path d="M0 402 Q300 390 800 406 V450H0Z" fill="#16332D"/>`;
  }
  return `${head}${defs}</defs><rect width="800" height="450" fill="url(#${id})"/>${sun}${body}</svg>`;
}
/* Медіа-блок: фото поверх ілюстрації. Якщо фото не завантажилося — лишається ілюстрація. */
function media(kind, img, v = 0, alt = '', extra = '') {
  const imgTag = img ? `<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy" decoding="async" onerror="this.remove()">` : '';
  return `<div class="media">${scene(kind, v)}${imgTag}${extra}</div>`;
}

  return `<article class="pcard">
    <a href="#/projects/${p.slug}" aria-label="${esc(L(p.name))}">${media(p.scene, p.image, 0, L(p.name), `<span class="pcard__badge">${esc(L(p.badge))}</span>`)}</a>

      <a class="btn btn--sm" href="#/projects/${p.slug}">${t('project_card')}</a>

function newsCard(n, i) {

    <time datetime="${n.date}">${fmtDate(n.date)}</time>

}
function ringHTML(p) {
  const C = 2 * Math.PI * 52;
  return `<div class="ring"><div class="ring__box">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring__track" cx="60" cy="60" r="52"/><circle class="ring__bar" cx="60" cy="60" r="52" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-offset="${(C * (1 - p.progress / 100)).toFixed(1)}"/></svg>
      <div class="ring__val"><span>${p.progress}%</span><small>${t('built')}</small></div>
    </div><h3>${esc(L(p.name))}</h3></div>`;
}
function medal(abbr) {
  const fs = abbr.length > 4 ? 15 : 22;
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="60" fill="var(--accent-soft)"/><circle cx="66" cy="66" r="50" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="66" cy="66" r="45" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 4"/><text x="66" y="${66 + fs / 3}" text-anchor="middle" font-family="Unbounded, Arial" font-weight="400" font-size="${fs}" fill="var(--ink)">${esc(abbr)}</text></svg>`;
}
function awardsHTML() {
  const items = CONTENT.awards.map(a => `<div class="award"><div class="award__medal">${medal(a.abbr)}${a.count > 1 ? `<span class="award__count">x${a.count}</span>` : ''}</div><h3>${esc(L(a.title))}</h3><p>${esc(L(a.note))}</p></div>`);
  const slots = Math.max(0, 5 - items.length);
  for (let i = 0; i < slots; i++) items.push(`<div class="award award--empty" aria-hidden="true"><div class="award__medal">+</div><p>${t('award_slot')}</p></div>`);
  return `<div class="awards">${items.join('')}</div>`;
}
function contourSVG() {
  let d = ''; for (let i = 0; i < 9; i++) { const r = 36 + i * 26; d += `<ellipse cx="${260 + i * 3}" cy="${260 - i * 2}" rx="${r}" ry="${(r * .74).toFixed(1)}" transform="rotate(${i * 7} 260 260)"/>`; }
  return `<svg class="deep__contour" viewBox="0 0 520 520" aria-hidden="true">${d}</svg>`;
}

let _fid = 0;
function field(name, label, opts = {}) {
  const id = 'f' + (++_fid);
  const err = opts.err ? `<span class="field__err" id="${id}e">${opts.err}</span>` : '';
  const aria = opts.err ? `aria-describedby="${id}e"` : '';
  let control;
  if (opts.type === 'textarea') control = `<textarea id="${id}" name="${name}" ${aria}></textarea>`;
  else if (opts.type === 'select') control = `<select id="${id}" name="${name}">${opts.options.map(o => `<option>${o}</option>`).join('')}</select>`;
  else control = `<input id="${id}" name="${name}" type="${opts.type || 'text'}" ${opts.ac ? `autocomplete="${opts.ac}"` : ''} ${opts.v ? `data-v="${opts.v}"` : ''} ${opts.inputmode ? `inputmode="${opts.inputmode}"` : ''} ${opts.ph ? `placeholder="${opts.ph}"` : ''} ${aria}>`;
  return `<div class="field"><label for="${id}">${label}</label>${control}${err}</div>`;
}

const RX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const digits = (s) => s.replace(/\D/g, '');
function validate(form) {
  let ok = true, firstBad = null;
  form.querySelectorAll('[data-v]').forEach(inp => {
    const v = inp.value.trim(), kind = inp.dataset.v;
    let good = true;
    if (kind === 'name') good = v.length >= 2;
    if (kind === 'phone') good = digits(v).length >= 10;
    if (kind === 'email-opt') good = !v || RX_EMAIL.test(v);
    if (kind === 'contact') good = RX_EMAIL.test(v) || digits(v).length >= 10;
    const f = inp.closest('.field');
    f.classList.toggle('is-invalid', !good);
    inp.setAttribute('aria-invalid', String(!good));
    if (!good) { ok = false; firstBad = firstBad || inp; }
  });
  if (firstBad) firstBad.focus();
  return ok;
}

  modalBody.innerHTML = `<div class="modal__top"><div><h2 id="modal-title">${title}</h2>${text ? `<p class="muted" style="margin-top:8px">${text}</p>` : ''}</div>

  if (!modal.open) modal.showModal();
  const f = modalBody.querySelector('input,button.choice-btn,select,textarea');
  if (f) f.focus();
}
function closeModal() { if (modal.open) modal.close(); }
modal.addEventListener('close', () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

/* ---- Квіз «Підібрати об'єкт за 3 кроки» ---- */
const quiz = { step: 1, type: '', goal: '' };
function openQuiz() { quiz.step = 1; quiz.type = ''; quiz.goal = ''; openModal(t('quiz_title'), '', quizHTML()); }
function quizHTML() {
  const bar = `<div class="quiz__bar" aria-hidden="true"><i style="width:${quiz.step * 33.34}%"></i></div><p class="quiz__step" style="margin:10px 0 18px">${t('quiz_step').replace('{n}', quiz.step)}</p>`;
  if (quiz.step === 1) {
    const opts = [['res', t('q1_res'), t('q1_res_s')], ['com', t('q1_com'), t('q1_com_s')], ['vil', t('q1_vil'), t('q1_vil_s')]];
    return `${bar}<h3 style="margin-bottom:14px">${t('q1')}</h3><div class="choice">${opts.map(o => `<button class="choice-btn" data-quiz="type" data-val="${o[1]}" aria-pressed="${quiz.type === o[1]}"><span>${o[1]}<small>${o[2]}</small></span></button>`).join('')}</div>`;
  }
  if (quiz.step === 2) {
    const opts = [t('q2_live'), t('q2_rent'), t('q2_inv')];
    return `${bar}<h3 style="margin-bottom:14px">${t('q2')}</h3><div class="choice">${opts.map(o => `<button class="choice-btn" data-quiz="goal" data-val="${o}" aria-pressed="${quiz.goal === o}">${o}</button>`).join('')}</div>
      <div class="quiz__nav" style="margin-top:18px"><button class="link" data-quiz="back">${t('back')}</button></div>`;
  }
  return `${bar}<h3 style="margin-bottom:6px">${t('q3')}</h3><p class="muted" style="margin-bottom:16px">${t('q3_text')}</p>
    <form class="form" data-form="quiz" data-thanks="quiz_thanks" novalidate>
      <input type="hidden" name="type" value="${esc(quiz.type)}"><input type="hidden" name="goal" value="${esc(quiz.goal)}">
      ${phoneField()}
      <fieldset style="border:0;padding:0;margin:0"><legend class="field" style="font-size:.88rem;font-weight:500;margin-bottom:8px">${t('q3_msgr')}</legend>
        <div class="chips">${['Telegram', 'Viber', 'WhatsApp'].map((m, i) => `<label><input type="radio" name="messenger" value="${m}" ${i === 0 ? 'checked' : ''}><span>${m}</span></label>`).join('')}</div></fieldset>
      <div class="quiz__nav"><button type="button" class="link" data-quiz="back">${t('back')}</button><button class="btn btn--accent" type="submit">${t('q3_send')}</button></div>
      ${note()}
    </form>`;
}
function quizRerender() {
  document.getElementById('modal-content').innerHTML = quizHTML();
  const f = modalBody.querySelector('#modal-content .choice-btn, #modal-content input[type=tel]');
  if (f) f.focus();
}

/* ============================ РОУТЕР ============================ */
const app = document.getElementById('app');
let sliderTimer = null, io = null;
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [page = '', sub = ''] = h.split('/');
  let html, current = page, target = null, title = 'BGV Development';
  switch (page) {
    case '': html = homePage(); break;
    case 's': html = homePage(); target = sub; current = sub; break;
    case 'projects':
      if (sub && !CONTENT.categories[sub]) {
        const p = CONTENT.projects.find(x => x.slug === sub);
        html = p ? projectPage(p) : notFound(); if (p) title = L(p.name) + ' — BGV Development';
      } else { html = projectsPage(sub); title = t('nav_projects') + ' — BGV Development'; }
      break;
    case 'investors': html = investorsPage(); title = t('nav_investors_full') + ' — BGV Development'; break;
    case 'press': html = pressPage(sub); title = t('nav_press') + ' — BGV Development'; break;
    case 'about': html = aboutPage(); target = sub; title = t('nav_about') + ' — BGV Development'; break;
    case 'contacts': html = contactsPage(); title = t('nav_contacts') + ' — BGV Development'; break;
    case 'privacy': case 'terms': html = legalPage(page); title = t(page) + ' — BGV Development'; break;
    default: html = notFound();
  }
  document.documentElement.lang = LANG === 'en' ? 'en' : 'uk';
  document.title = page === '' ? 'BGV Development — ' + (LANG === 'en' ? 'full-cycle development' : 'девелопмент повного циклу') : title;
  app.innerHTML = headerHTML(current) + `<main id="main">${html}</main>` + footerHTML() + fabHTML();
  afterRender();
  const el = target && document.getElementById(target);
  if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 84; window.scrollTo({ top: y, behavior: 'auto' }); }
  else window.scrollTo(0, 0);
}

function afterRender() {
  onScroll();
  // слайдер
  clearInterval(sliderTimer);
  const slider = document.getElementById('slider');
  if (slider) {
    const slides = [...slider.querySelectorAll('.slide')];
    const items = CONTENT.projects.slice(0, 3);
    let idx = 0;
    const go = (i) => {
      idx = (i + slides.length) % slides.length;
      slides.forEach((s, k) => { s.classList.toggle('is-active', k === idx); s.setAttribute('aria-hidden', String(k !== idx)); });
      slider.querySelectorAll('[data-go]').forEach((b, k) => b.setAttribute('aria-selected', String(k === idx)));
      const p = items[idx];
      document.getElementById('slider-name').textContent = L(p.name);
      document.getElementById('slider-meta').textContent = statusLabel(p.status) + (p.location ? ', ' + L(p.location) : '');
      document.getElementById('slider-link').setAttribute('href', '#/projects/' + p.slug);
    };
    slider.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { go(+b.dataset.go); restart(); }));
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const restart = () => { clearInterval(sliderTimer); if (!reduce) sliderTimer = setInterval(() => go(idx + 1), 6500); };
    slider.addEventListener('mouseenter', () => clearInterval(sliderTimer));
    slider.addEventListener('mouseleave', restart);
    restart();
  }
  // мапа на головній
  const mapBox = document.getElementById('map-box');
  if (mapBox) {
    const select = (slug) => {
      const p = CONTENT.projects.find(x => x.slug === slug); if (!p) return;
      mapBox.querySelectorAll('.pin').forEach(g => g.classList.toggle('is-active', g.dataset.pin === slug));
      document.querySelectorAll('#maplist [data-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === slug)));
      document.getElementById('mapcard').innerHTML = mapCard(p);
    };
    mapBox.addEventListener('click', e => { const g = e.target.closest('.pin'); if (g) select(g.dataset.pin); });
    mapBox.addEventListener('keydown', e => { const g = e.target.closest('.pin'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.dataset.pin); } });
    document.querySelectorAll('#maplist [data-pick]').forEach(b => b.addEventListener('click', () => select(b.dataset.pick)));
  }
  // інші мапи (сторінка проєкту): пін веде на сторінку об'єкта
  document.querySelectorAll('.map:not(#map-box) .pin').forEach(g => {
    const open = () => { location.hash = '#/projects/' + g.dataset.pin; };
    g.addEventListener('click', open);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
  // вкладки проєктів
  document.querySelectorAll('[data-tabs="projects"] [data-cat]').forEach(b => b.addEventListener('click', () => {
    const cat = b.dataset.cat;
    if (location.hash.startsWith('#/projects')) { location.hash = '#/projects' + (cat === 'all' ? '' : '/' + cat); return; }
    b.parentElement.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    const list = cat === 'all' ? CONTENT.projects : CONTENT.projects.filter(p => p.category === cat);
    document.getElementById('pgrid').innerHTML = list.length ? list.map(projectCard).join('') : `<p class="empty">${t('no_items')}</p>`;
  }));
  // лічильники та кільця
  if (io) io.disconnect();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const targets = document.querySelectorAll('[data-count], .ring__bar');
  if (!('IntersectionObserver' in window) || reduce) {
    document.querySelectorAll('.ring__bar').forEach(r => r.style.strokeDashoffset = r.dataset.offset);
    return;
  }
  io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; io.unobserve(el);
    if (el.classList.contains('ring__bar')) { el.style.strokeDashoffset = el.dataset.offset; return; }
    const end = +el.dataset.count, pre = el.dataset.prefix || '', suf = el.dataset.suffix || '';
    const t0 = performance.now(), dur = 1400;
    const tick = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + fmt(Math.round(end * e)) + suf; if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }), { threshold: 0.35 });
  targets.forEach(el => io.observe(el));
}

/* ============================ ПОДІЇ ============================ */
function onScroll() { const h = document.getElementById('hdr'); if (h) h.classList.toggle('is-scrolled', window.scrollY > 8); }
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', () => { closeModal(); route(); });

document.addEventListener('click', (e) => {
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { LANG = langBtn.dataset.lang; try { localStorage.setItem('bgv-lang', LANG); } catch (err) {} route(); return; }

  const q = e.target.closest('[data-quiz]');
  if (q) {
    e.preventDefault();
    const k = q.dataset.quiz;
    if (k === 'back') quiz.step = Math.max(1, quiz.step - 1);
    else { quiz[k] = q.dataset.val; quiz.step += 1; }
    quizRerender(); return;
  }

  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (a.tagName === 'A') e.preventDefault();
    const mnav = document.getElementById('mnav'), fab = document.getElementById('fab');
    if (act !== 'fab' && fab) { fab.classList.remove('is-open'); fab.querySelector('.fab__btn').setAttribute('aria-expanded', 'false'); }
    if (act !== 'menu' && mnav) { mnav.classList.remove('is-open'); document.body.style.overflow = ''; }
    switch (act) {
      case 'quiz': openQuiz(); break;
      case 'callback': openModal(t('call_title'), t('call_text'), callbackForm()); break;
      case 'contact': openModal(t('contact_title'), t('contact_text'), contactForm('floating-button')); break;
      case 'partner': openModal(t('partner_title'), t('partner_text'), partnerForm()); break;
      case 'lead': {
        const p = CONTENT.projects.find(x => x.slug === a.dataset.project);
        openModal(t('lead_title'), (p ? L(p.name) + '. ' : '') + t('lead_text'), leadForm(p && p.slug));
        break;
      }
      case 'modal-close': closeModal(); break;
      case 'menu': mnav.classList.add('is-open'); document.body.style.overflow = 'hidden'; mnav.querySelector('.mnav__close').focus(); break;
      case 'menu-close': break;
      case 'fab': { const open = fab.classList.toggle('is-open'); a.setAttribute('aria-expanded', String(open)); break; }
    }
    return;
  }

  const link = e.target.closest('a[href^="#/"]');
  if (link) {
    const mnav = document.getElementById('mnav'); if (mnav) { mnav.classList.remove('is-open'); document.body.style.overflow = ''; }
    if (link.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
  }
  const fab = document.getElementById('fab');
  if (fab && !e.target.closest('#fab')) { fab.classList.remove('is-open'); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const mnav = document.getElementById('mnav'); if (mnav && mnav.classList.contains('is-open')) { mnav.classList.remove('is-open'); document.body.style.overflow = ''; }
    const fab = document.getElementById('fab'); if (fab) fab.classList.remove('is-open');
  }
});

document.addEventListener('input', (e) => {
  const f = e.target.closest('.field.is-invalid'); if (f) { f.classList.remove('is-invalid'); e.target.removeAttribute('aria-invalid'); }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  if (!validate(form)) return;
  const payload = Object.fromEntries(new FormData(form).entries());
  payload.source = form.dataset.form; payload.lang = LANG; payload.page = location.hash || '#/'; payload.sentAt = new Date().toISOString();
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  sendLead(payload).then(() => {
    const inModal = !!form.closest('dialog');
    form.outerHTML = thanksHTML(form.dataset.thanks, inModal);
    const th = (inModal ? modalBody : document).querySelector('.thanks'); if (th) th.focus();
  });
});

/* ======================= SANITY CMS =======================
   Контент береться з Sanity (проєкт s9wsv7k3, датасет production, лише публічне читання — без токенів).
   Режим редагування: додайте до адреси ?edit  (вимкнути: ?edit=0).
   У ньому клік по тексту відкриває відповідне поле в Sanity Studio; Vercel Toolbar теж бачить ці позначки.
   ========================================================== */
const SANITY = { projectId: 's9wsv7k3', dataset: 'production', apiVersion: '2026-09-01', studioUrl: 'https://bgv-development.sanity.studio' };
const EDIT_MODE = (() => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('edit')) { const on = q.get('edit') !== '0'; sessionStorage.setItem('bgv-edit', on ? '1' : '0'); return on; }
    return sessionStorage.getItem('bgv-edit') === '1';
  } catch (e) { return false; }
})();
const SANITY_QUERY = `{
  "s": *[_id == "siteSettings"][0]{ contacts, company_presentation_pdf, heroStats, aboutStats, advantages, categories, newsCategories, awardsIntro, awards, investors, about },
  "projects": *[_type == "project" && defined(slug.current)] | order(order asc){
    "slug": slug.current, category, scene, name, badge, status, completion, area, location, partner, site, presentation_pdf, progress, map, image, award, desc },
  "news": *[_type == "newsItem" && defined(date)] | order(date desc){ date, cat, scene, url, title }
}`;
const STEGA_FIELDS = ['ua', 'en', 'phone', 'partner'];

async function loadSanityContent() {
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@sanity/client@7/+esm');
  const client = createClient({
    projectId: SANITY.projectId, dataset: SANITY.dataset, apiVersion: SANITY.apiVersion,
    useCdn: !EDIT_MODE, perspective: 'published',
    stega: EDIT_MODE ? { enabled: true, studioUrl: SANITY.studioUrl,
      filter: (props) => STEGA_FIELDS.includes(String(props.sourcePath[props.sourcePath.length - 1])) } : false
  });
  const d = await client.fetch(SANITY_QUERY);
  if (!d || !d.s) throw new Error('Sanity: порожня відповідь');
  const clean = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v === null ? undefined : v)));
  const s = clean(d.s);
  for (const k of Object.keys(s)) if (s[k] !== undefined) CONTENT[k] = s[k];
  if (Array.isArray(d.projects) && d.projects.length) CONTENT.projects = clean(d.projects);
  if (Array.isArray(d.news)) CONTENT.news = clean(d.news);
}

async function enableEditOverlay() {
  const { vercelStegaDecode } = await import('https://cdn.jsdelivr.net/npm/@vercel/stega@0.1/+esm');
  const ownText = (el) => Array.from(el.childNodes).filter(n => n.nodeType === 3).map(n => n.nodeValue).join('');
  const findSource = (el) => {
    for (let i = 0; el && i < 5; i++, el = el.parentElement) {
      const txt = ownText(el);
      if (txt) { try { const r = vercelStegaDecode(txt); if (r && r.href) return { el, href: r.href }; } catch (e) {} }
    }
    return null;
  };
  const st = document.createElement('style');
  st.textContent = '.cms-hl{outline:2px dashed #C9973A!important;outline-offset:3px;cursor:pointer!important}' +
    '.cms-bar{position:fixed;left:16px;bottom:16px;z-index:99999;background:#16332D;color:#fff;font:14px/1.3 system-ui,sans-serif;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}' +
    '.cms-bar a{color:#F2E5C6}';
  document.head.appendChild(st);
  const bar = document.createElement('div');
  bar.className = 'cms-bar';
  bar.innerHTML = '<span>✏️ Режим редагування: натисніть на текст, щоб змінити його в Sanity</span><a href="?edit=0">Вийти</a>';
  document.body.appendChild(bar);
  let cur = null;
  document.addEventListener('mouseover', (e) => {
    const f = findSource(e.target);
    if (cur && (!f || f.el !== cur)) cur.classList.remove('cms-hl');
    cur = f ? f.el : null;
    if (cur) cur.classList.add('cms-hl');
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.cms-bar')) return;
    const f = findSource(e.target);
    if (!f) return;
    e.preventDefault(); e.stopPropagation();
    window.open(f.href, 'bgv-studio');
  }, true);
}

(async () => {
  try {
    await Promise.race([
      loadSanityContent(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Sanity: тайм-аут')), EDIT_MODE ? 8000 : 3000))
    ]);
  } catch (err) {
    console.warn('Контент із Sanity не завантажився, показуємо резервний:', err);
  }
  route();
  if (EDIT_MODE) enableEditOverlay().catch(err => console.warn('Режим редагування недоступний:', err));
})();
</script>
